name: Build & publish

# On every push to main: build, publish dist/ to the `dist` branch (what the
# remote loaders point at), then purge jsDelivr so clients get it within minutes
# instead of waiting ~12h for the CDN cache to expire.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # The remote loader fetches this uncached and loads theme.js/user.css with
      # ?v=<commit>, so browsers don't hold on to jsDelivr's 7-day cached copies.
      - name: Write version.json
        run: echo "{\"v\":\"${GITHUB_SHA}\"}" > dist/version.json

      - name: Publish to dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: dist
          publish_dir: ./dist
          force_orphan: true

      - name: Purge jsDelivr cache
        uses: egad13/purge-jsdelivr-cache@v1
        with:
          url: |
            https://cdn.jsdelivr.net/gh/${{ github.repository }}@dist/version.json
            https://cdn.jsdelivr.net/gh/${{ github.repository }}@dist/theme.js
            https://cdn.jsdelivr.net/gh/${{ github.repository }}@dist/user.css
