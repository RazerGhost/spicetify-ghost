name: Build & publish

# On every push to main: build, publish dist/ to the `dist` branch (what the
# remote loaders point at), then purge jsDelivr so clients get it within minutes
# instead of waiting ~12h for the CDN cache to expire.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish to dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: dist
          publish_dir: ./dist
          force_orphan: true

      # The remote loader loads commit-pinned URLs (immutable, no purge needed);
      # this only refreshes the @dist fallback it uses before it knows a commit.
      # jsDelivr throttles purges after several pushes in a row — that's
      # harmless, so it mustn't fail the release.
      - name: Purge jsDelivr cache
        continue-on-error: true
        uses: egad13/purge-jsdelivr-cache@v1
        with:
          url: |
            https://cdn.jsdelivr.net/gh/${{ github.repository }}@dist/theme.js
            https://cdn.jsdelivr.net/gh/${{ github.repository }}@dist/user.css
